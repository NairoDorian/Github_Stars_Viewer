# Publishes the app (the public/ folder) to GitHub Pages on every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:   # syntax check + unit tests on every supported Node; a broken build is never published
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # a failure on one Node version must not hide the result of the others
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:   # only the deploy job may publish
      contents: read
      pages: write
      id-token: write
    concurrency:   # one deployment at a time; a newer push waits instead of cancelling a deployment that is running
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp this deploy's version on every file URL   # a browser's 10-minute cache then can't mix files of two deploys
        run: |
          cp -r public dist
          node scripts/stamp.cjs dist "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
